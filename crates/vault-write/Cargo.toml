[package]
name = "vault-write"
version = "0.1.0"
edition = "2024"

[features]
default = []
tauri-events = ["dep:tauri-specta"]

[dependencies]
hypr-fs-format = { workspace = true }
hypr-fs-sync-core = { workspace = true }
hypr-storage = { workspace = true }
hypr-tiptap = { workspace = true }
hypr-vault-read = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["derive", "serde_json"] }
tauri-specta = { workspace = true, optional = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
