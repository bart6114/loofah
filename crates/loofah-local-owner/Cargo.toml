[package]
name = "loofah-local-owner"
version = "0.1.0"
edition = "2024"

[features]
core = ["dep:hypr-loofah-core"]

[dependencies]
hypr-loofah-core = { workspace = true, optional = true }
hypr-loofah-protocol = { workspace = true }
hypr-storage = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem"] }
