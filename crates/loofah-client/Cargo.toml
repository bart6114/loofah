[package]
name = "loofah-client"
version = "0.1.0"
edition = "2024"

[features]
dev-fixtures = []
os-credentials = ["dep:keyring"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
hypr-capture-store = { workspace = true }
hypr-loofah-protocol = { workspace = true }
hypr-search-cache = { workspace = true }
hypr-storage = { workspace = true }
hypr-vault-read = { workspace = true }
keyring = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "stream", "form", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time", "rt", "macros", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
