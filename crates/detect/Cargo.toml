[package]
name = "detect"
version = "0.1.0"
edition = "2024"

[features]
default = []
mic = ["list"]
language = []
list = []
app = ["mic"]
sleep = ["mic"]

[dependencies]
isolang = { workspace = true }
lazy_static = { workspace = true }
regex = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }

serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, features = ["derive"] }

[target."cfg(target_os = \"macos\")".dependencies]
hypr-bundle = { workspace = true }
hypr-language = { workspace = true }

plist = "1.7"
cidre = { workspace = true }
block2 = { workspace = true }

objc2-foundation = { workspace = true, features = ["NSLocale", "NSArray", "NSString"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication", "libc"] }
objc2 = { workspace = true }

[[example]]
name = "detector"
required-features = ["mic", "list", "sleep", "app", "language"]

[target."cfg(target_os = \"linux\")".dependencies]
libpulse-binding = "2.30"

[target.'cfg(target_os = "windows")'.dependencies]
hypr-language = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_System_Variant", "Win32_System_Threading", "Win32_Globalization", "Win32_Storage_Packaging_Appx", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
