[package]
name = "hooks"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shellexpand = { workspace = true }
specta = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time", "macros"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
shell-words = "1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
