[package]
name = "loofah-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aspasia = "0.2.1"
async-stream = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hound = { workspace = true }
hypr-agent-access = { workspace = true }
hypr-audio-utils = { workspace = true }
hypr-capture-store = { workspace = true }
hypr-fs-sync-core = { workspace = true }
hypr-loofah-protocol = { workspace = true }
hypr-search-cache = { workspace = true }
hypr-storage = { workspace = true }
hypr-template-app = { workspace = true }
hypr-tiptap = { workspace = true }
hypr-vault-read = { workspace = true }
hypr-vault-write = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mime_guess = { workspace = true }
notify = "8"
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["derive", "serde_json"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
axum = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
