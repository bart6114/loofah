[package]
name = "loofah-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { workspace = true }
hypr-agent-access = { workspace = true }
hypr-fs-sync-core = { workspace = true }
hypr-loofah-protocol = { workspace = true }
hypr-search-cache = { workspace = true }
hypr-storage = { workspace = true }
hypr-vault-read = { workspace = true }
hypr-vault-write = { workspace = true }
mime_guess = { workspace = true }
notify = "8"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["derive", "serde_json"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
