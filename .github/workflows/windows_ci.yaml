name: windows-ci

on:
  workflow_dispatch:
    inputs:
      speech-models:
        description: Download pinned models and run real CPU inference
        type: boolean
        default: false
  push:
    branches: [main, chore/windows-support]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The docs workspace includes workerd, which has no Windows ARM64 build.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild dprint
      - uses: denoland/setup-deno@v2
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - run: pnpm -F ui build
      - run: cargo check --locked -p desktop -p loof-cli
      - run: cargo test --locked -p desktop -p loof-cli -p vault-read -p vault-write -p storage -p fs-sync-core -p audio-actual -p device-monitor -p detect -p notification -p transcribe-onnx -p transcribe-soniqo -p local-stt-core
      - name: Diagnose native runtime dependencies
        if: failure()
        run: |
          Get-ChildItem target/debug/deps/loofah_desktop_lib-*.exe | ForEach-Object {
            node apps/desktop/src-tauri/scripts/check-windows-runtime.mjs $_.FullName
          }
      - if: github.event_name == 'workflow_dispatch' && inputs.speech-models
        run: cargo test --locked -p transcribe-onnx --test inference -- --ignored --nocapture
      - run: node apps/desktop/src-tauri/scripts/build-cli-sidecar.mjs
      - run: pnpm -F desktop tauri build --ci --bundles nsis --config ./src-tauri/tauri.conf.staging.json --config ./src-tauri/tauri.windows.conf.json --config ./src-tauri/tauri.windows.bundle.conf.json --features staging
      - name: Check CLI
        run: |
          & target/release/loof.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/release/loof.exe mcp --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: loofah-windows-${{ matrix.target }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            target/release/loof.exe
          if-no-files-found: error
          retention-days: 14
