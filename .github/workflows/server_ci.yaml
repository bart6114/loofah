name: server-ci

on:
  pull_request:
    paths:
      - apps/server/**
      - crates/vault-access/**
      - crates/vault-write/**
      - crates/vault-read/**
      - crates/fs-sync-core/**
      - crates/search-cache/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/server_ci.yaml
      - scripts/check-storage-coverage.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust_install
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: >-
          cargo llvm-cov --locked -p loofah-server -p vault-access -p vault-write
          --ignore-filename-regex '(/tests/|/tests\.rs$)'
          --json --summary-only --output-path target/storage-coverage.json
      - run: python3 scripts/check-storage-coverage.py target/storage-coverage.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-coverage
          path: target/storage-coverage.json
          if-no-files-found: ignore
      - run: cargo clippy --locked -p loofah-server -p vault-access --all-targets --no-deps -- -D warnings
      - run: cargo build --locked --release -p loofah-server
