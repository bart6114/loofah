name: codex-issues
run-name: "codex-issues: ${{ inputs.mode || github.event_name }}"

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run the authentication pilot, review an issue, or retry a failed issue
        type: choice
        options: [pilot, issue, retry]
        default: pilot
      issue_number:
        description: Required for issue and retry
        type: string

permissions: {}

# The full workflow owns the refresh-token lease, including the fresh-runner pilot.
concurrency:
  group: codex-subscription-auth
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: >-
      github.repository == 'bart6114/loofah' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor == 'bart6114') &&
      (vars.CODEX_ISSUES_ENABLED == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: select
        run: node .github/scripts/codex-issues/controller.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_ISSUES_ENABLED: ${{ vars.CODEX_ISSUES_ENABLED }}
          CODEX_ISSUES_SINCE: ${{ vars.CODEX_ISSUES_SINCE }}
      - if: steps.select.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/codex-issue/request.json
          if-no-files-found: error
          retention-days: 1

  codex:
    needs: select
    if: needs.select.outputs.mode != 'none'
    environment: codex-subscription
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/codex-issue
      - id: check
        run: node .github/scripts/codex-issues/controller.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.check.outputs.valid == 'true'
        run: npm install --global @openai/codex@0.154.0
      - if: steps.check.outputs.valid == 'true'
        run: node .github/scripts/codex-issues/runner.mjs
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_ENV_TOKEN: ${{ secrets.CODEX_ENV_TOKEN }}
      - if: steps.check.outputs.valid == 'true' && needs.select.outputs.mode != 'pilot'
        uses: actions/upload-artifact@v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-issue/result.json
          if-no-files-found: error
          retention-days: 1

  verify-auth:
    needs: [select, codex]
    if: needs.select.outputs.mode == 'pilot'
    environment: codex-subscription
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/codex-issue
      - run: npm install --global @openai/codex@0.154.0
      - run: node .github/scripts/codex-issues/runner.mjs --verify
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_ENV_TOKEN: ${{ secrets.CODEX_ENV_TOKEN }}

  publish:
    needs: [select, codex]
    if: needs.select.outputs.mode != 'pilot' && needs.codex.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/codex-issue
      - uses: actions/download-artifact@v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-issue
      - run: node .github/scripts/codex-issues/controller.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}

  report-failure:
    needs: [select, codex, publish]
    if: >-
      always() && needs.select.result == 'success' &&
      needs.select.outputs.mode != 'none' && needs.select.outputs.mode != 'pilot' &&
      (needs.codex.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: codex-request
          path: ${{ runner.temp }}/codex-issue
      - run: node .github/scripts/codex-issues/controller.mjs failed
        env:
          GH_TOKEN: ${{ github.token }}
