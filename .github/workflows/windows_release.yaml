name: windows-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag containing Windows support
        required: true
        type: string
      publish:
        description: Attach signed assets and advance the Windows updater feed
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          lfs: true
          persist-credentials: false
      - name: Validate release and signing provisioning
        env:
          GH_TOKEN: ${{ github.token }}
          LOOFAH_WINDOWS_SIGN_COMMAND: ${{ secrets.LOOFAH_WINDOWS_SIGN_COMMAND }}
          LOOFAH_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.LOOFAH_WINDOWS_SIGNER_THUMBPRINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'A stable vX.Y.Z tag is required' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) { throw 'An existing stable release is required' }
          foreach ($name in @('LOOFAH_WINDOWS_SIGN_COMMAND', 'LOOFAH_WINDOWS_SIGNER_THUMBPRINT', 'TAURI_SIGNING_PRIVATE_KEY')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Provision $name before building a stable installer" }
          }
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild dprint
      - run: node .github/scripts/install_windows_deno.mjs
      - uses: ./.github/actions/rust_install
        with:
          platform: windows
      - run: pnpm -F ui build
      - name: Build signed CLI and installer
        env:
          LOOFAH_WINDOWS_SIGN_COMMAND: ${{ secrets.LOOFAH_WINDOWS_SIGN_COMMAND }}
          LOOFAH_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.LOOFAH_WINDOWS_SIGNER_THUMBPRINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node apps/desktop/src-tauri/scripts/prepare-windows-signing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/src-tauri/scripts/build-cli-sidecar.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -F desktop tauri build --ci --bundles nsis --config ./src-tauri/tauri.conf.stable.json --config ./src-tauri/tauri.windows.conf.json --config ./src-tauri/tauri.windows.bundle.conf.json --config ./src-tauri/tauri.windows.stable.conf.json --config "$env:RUNNER_TEMP/loofah-signing.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare release artifacts
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node apps/desktop/src-tauri/scripts/package-windows-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-${{ matrix.target }}
          path: artifacts/windows-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-windows-*
          path: artifacts
          merge-multiple: true
      - name: Publish both architectures and advance the Windows feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          jq -se --arg version "$version" '
            length == 2 and all(.[]; .version == $version) and
            ([.[].platforms | keys[]] | sort == ["windows-aarch64", "windows-x86_64"])
          ' artifacts/platform-*.json >/dev/null
          jq -s '.[0] * .[1]' artifacts/platform-*.json > artifacts/latest-windows.json
          gh release upload "$RELEASE_TAG" artifacts/*.exe artifacts/*.sig artifacts/*.zip artifacts/*.sha256 artifacts/latest-windows.json
          assets="$(gh release view updater --json assets --jq '.assets[].name')"
          if grep -Fxq latest-windows.json <<< "$assets"; then
            gh release download updater --pattern latest-windows.json -O previous-windows.json
            previous="$(jq -er .version previous-windows.json)"
            newest="$(printf '%s\n%s\n' "$previous" "$version" | sort -V | tail -n1)"
            if [ "$newest" != "$version" ] || [ "$previous" = "$version" ]; then
              echo "Windows feed already at $previous; keeping it."
              exit 0
            fi
          fi
          gh release upload updater artifacts/latest-windows.json --clobber
