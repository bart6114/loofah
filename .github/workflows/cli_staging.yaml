name: cli-staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust_install
      - run: cargo test --locked -p vault-sync -p loof-cli --features loof-cli/staging
      - run: cargo build --locked --release -p loof-cli --features staging
      - name: Package staging CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cp target/release/loof target/release/loof-staging
          if [ "$(uname -s)" = Darwin ]; then
            strip -x target/release/loof-staging
            codesign -s - -f target/release/loof-staging
          else
            strip target/release/loof-staging
          fi
          target/release/loof-staging sync --help
          asset="loof-staging-${TARGET}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$asset" -C target/release loof-staging
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: loof-staging-${{ matrix.target }}
          path: |
            loof-staging-*.tar.gz
            loof-staging-*.tar.gz.sha256
          if-no-files-found: error
