name: changelog

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish manual notes for (defaults to the latest release)
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish manual notes for
        required: true
        type: string

permissions: {}

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      group: changelog-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The app fetches notes from main; tags identify the comparison base.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$(gh release view "$INPUT_TAG" --json tagName --jq .tagName)"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null
          version="${tag#v}"

          # Base = last SHIPPED version (updater feed): users update from there
          # and only ever see this one file, so it must cover every tag since.
          # Fall back to the previous v* tag for backfills, re-ships, and a
          # missing feed.
          feed_version="$(gh release download updater --pattern latest.json -O - 2>/dev/null | jq -r .version || true)"
          if [ -n "$feed_version" ] \
            && git rev-parse -q --verify "refs/tags/v$feed_version^{commit}" >/dev/null \
            && [ "$feed_version" != "$version" ] \
            && [ "$(printf '%s\n%s\n' "$feed_version" "$version" | sort -V | tail -n1)" = "$version" ]; then
            base="v$feed_version"
          else
            base="$(git tag -l 'v*' | sort -V | awk -v t="$tag" '$0 == t { print prev; exit } { prev = $0 }')"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      - env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          file="packages/changelog/content/$VERSION.md"

          if [ ! -f "$file" ]; then
            echo "::error::Missing $file. Prepare manual release notes, commit to main with [skip ci], then rerun this workflow. See .agents/skills/desktop-release/SKILL.md."
            exit 1
          fi

          if ! head -n1 "$file" | grep -qx -- '---' \
            || ! grep -qE '^date: "[0-9]{4}-[0-9]{2}-[0-9]{2}"$' "$file" \
            || ! grep -qE '^summary: ".+"$' "$file" \
            || ! awk 'NR>1 && /^---$/ { f=1; next } f && NF { found=1 } END { exit !found }' "$file"; then
            echo "::error::Invalid $file. Require date and summary in quoted frontmatter, a closing ---, and a non-empty body."
            exit 1
          fi

      # Manual notes commits carry [skip ci], so dispatch the docs deployment.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs-deploy

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BASE: ${{ steps.meta.outputs.base }}
        run: |
          set -euo pipefail
          file="packages/changelog/content/$VERSION.md"
          notes="$RUNNER_TEMP/release-notes.md"
          awk 'NR==1 && /^---$/ { f=1; next } f && /^---$/ { f=0; next } !f' "$file" > "$notes"
          if [ -n "$BASE" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$BASE" "$TAG" >> "$notes"
          fi
          gh release edit "$TAG" --notes-file "$notes"
