name: cli-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.select.outputs.cli }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: python3 .github/scripts/ci_scope.py

  cli-ci:
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/cli_native_setup
        with:
          target: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/rust_install
        with:
          shared-key: cli-release-v1
      - run: |
          cargo test --locked -p export-core
          cargo test --locked -p search-cache
          cargo test --locked -p agent-access
          cargo test --locked -p loof-cli
          cargo test --locked -p tiptap
      - run: |
          cargo clippy --locked \
            -p search-cache \
            -p agent-access \
            -p export-core \
            -p loof-cli \
            -p tiptap \
            --all-targets \
            --no-deps \
            -- \
            -D warnings
      - run: cargo build --locked --release -p loof-cli
      - run: |
          target/release/loof --help
          target/release/loof --version
          target/release/loof meetings --help
          target/release/loof mcp --help
          if doctor_output="$(target/release/loof --json --vault-path "$RUNNER_TEMP/missing-vault" doctor)"; then
            echo "doctor unexpectedly reported a missing vault as ready"
            exit 1
          fi
          grep -q '"ready": false' <<<"$doctor_output"
          if invalid_output="$(target/release/loof --json meetings list --limit 0 2>&1)"; then
            echo "invalid arguments unexpectedly succeeded"
            exit 1
          fi
          grep -q '"code": "invalid_arguments"' <<<"$invalid_output"
  docs:
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          test -s skills/loofah/SKILL.md
          test "$(sed -n '1p' skills/loofah/SKILL.md)" = "---"
          grep -Eq '^name:[[:space:]]+loofah[[:space:]]*$' skills/loofah/SKILL.md
          grep -Eq '^description:[[:space:]]*(>|\||[^[:space:]])' skills/loofah/SKILL.md
          awk 'NR > 1 && $0 == "---" { found = 1; exit } END { if (!found) exit 1 }' skills/loofah/SKILL.md
          test "$(readlink docs/.mintlify/skills)" = "../../skills"
          test -f docs/.mintlify/skills/loofah/SKILL.md
          skill_list="$(npx --yes skills@1.5.16 add . --list)"
          echo "$skill_list"
          grep -q 'loofah' <<<"$skill_list"
          ! grep -q 'add-plugin' <<<"$skill_list"
      - run: |
          pnpm install --frozen-lockfile --filter @hypr/docs
          pnpm --filter @hypr/docs build
