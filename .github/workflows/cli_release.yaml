name: cli-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build CLI binaries for (defaults to the latest release)
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      skip-apple-silicon:
        type: boolean
        default: false
      defer-publication:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.tag.outputs.matrix }}
      build_required: ${{ steps.tag.outputs.build_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-ci
          sparse-checkout: .github
          persist-credentials: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          SKIP_APPLE_SILICON: ${{ inputs.skip-apple-silicon }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$(gh release view "$INPUT_TAG" --json tagName --jq .tagName)"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$assets" | python3 .release-ci/.github/scripts/cli_release_matrix.py "$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-ci
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.release-ci/.github/actions/cli_native_setup
        with:
          target: ${{ matrix.triple }}
      - uses: ./.release-ci/.github/actions/rust_install
      - run: cargo build --locked --release -p loof-cli --timings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-timings-${{ matrix.triple }}-${{ github.run_id }}
          path: target/cargo-timings/
          retention-days: 14
      - env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          bin=target/release/loof
          if [ "$(uname -s)" = "Darwin" ]; then
            strip -x "$bin"
            codesign -s - -f "$bin"
          else
            strip "$bin"
            LD_BIND_NOW=1 "$bin" --version | grep -F "$version"
            glibc="$(readelf --version-info "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
            test -n "$glibc"
            test "$(printf '%s\n' 2.35 "${glibc#GLIBC_}" | sort -V | tail -n1)" = 2.35
            if readelf --dynamic "$bin" | grep -Eq 'NEEDED.*lib(stdc\+\+|onnxruntime)'; then
              echo '::error::The Linux CLI must bundle its C++ and ONNX runtimes statically.'
              exit 1
            fi
          fi
          "$bin" --version | grep -F "$version"
          asset="loof-${version}-${TRIPLE}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$asset" -C target/release loof
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" \
            "loof-${version}-${TRIPLE}.tar.gz" \
            "loof-${version}-${TRIPLE}.tar.gz.sha256" \
            --clobber

  publish-latest:
    needs: [resolve, build]
    if: >-
      ${{
        always() &&
        !inputs.defer-publication &&
        needs.resolve.result == 'success' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/cli_publish.yaml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
