name: mobile-testflight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: iOS build number greater than the last TestFlight build for this version
        type: string
        required: true
      verified_mac_tag:
        description: Published Mac receiver tag with verified production iCloud signing
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      MAC_TAG: ${{ inputs.verified_mac_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check published Mac receiver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*([.][0-9]+){0,2}$ ]]
          [[ "$MAC_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          git cat-file -e "$MAC_TAG:apps/desktop/src-tauri/Entitlements.capture.plist"
          gh release view "$MAC_TAG" --json isDraft,assets | jq -e --arg dmg "Loofah_${MAC_TAG#v}_aarch64.dmg" '
            .isDraft == false and any(.assets[]; .name == $dmg) and any(.assets[]; .name == ($dmg + ".sha256"))
          '
      - name: Archive and export iPhone app
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          marketing_version="$(node -p 'require("./package.json").version')"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
            -authenticationKeyID "$APPLE_API_KEY" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          cd apps/mobile
          xcodegen generate
          xcodebuild archive -scheme Loofah -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Loofah.xcarchive" "${auth[@]}" \
            MARKETING_VERSION="$marketing_version" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Loofah.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/loofah-ipa" "${auth[@]}"
      - name: Verify exported app and upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/loofah-ipa/Loofah.ipa"
          ditto -x -k "$ipa" "$RUNNER_TEMP/loofah-ipa-check"
          app="$RUNNER_TEMP/loofah-ipa-check/Payload/Loofah.app"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist")" = '[1]'
          test "$(plutil -extract NSSupportsLiveActivities raw -o - "$app/Info.plist")" = true
          widget="$app/PlugIns/RecordingWidget.appex/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$widget")" = io.loofah.notes.RecordingWidget
          test "$(plutil -extract CFBundleVersion raw -o - "$widget")" = "$BUILD_NUMBER"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$widget")" = "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")"
          codesign --verify --deep --strict "$app"
          python3 scripts/verify-icloud-profile.py "$app/embedded.mobileprovision" io.loofah.notes --app "$app"
          xcrun altool --upload-app -f "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" \
            --p8-file-path "$RUNNER_TEMP/AuthKey.p8"
