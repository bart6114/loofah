name: mobile-testflight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: iOS build number greater than the last TestFlight build for this version
        type: string
        required: true
      verified_mac_tag:
        description: Published Mac receiver tag with verified production iCloud signing
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/chore/testflight-upload-ios27'
    runs-on: xcode-27
    defaults:
      run:
        shell: bash
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MAC_TAG: ${{ inputs.verified_mac_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.verified_mac_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check published Mac receiver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*([.][0-9]+){0,2}$ ]]
          [[ "$MAC_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          git cat-file -e "$MAC_TAG:apps/desktop/src-tauri/Entitlements.capture.plist"
          gh release view "$MAC_TAG" --json isDraft,assets | jq -e --arg dmg "Loofah_${MAC_TAG#v}_aarch64.dmg" '
            .isDraft == false and any(.assets[]; .name == $dmg) and any(.assets[]; .name == ($dmg + ".sha256"))
          '
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .testflight-asset
          sparse-checkout: .github/testflight
          persist-credentials: false
      - name: Open the signed iPhone build
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          IPA_KEY: ${{ secrets.LOOFAH_IOS_UPLOAD_KEY_2611_19_5 }}
        run: |
          set -euo pipefail
          test "$MAC_TAG" = v0.47.1
          test "$BUILD_NUMBER" = 2611.19.5
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p "$RUNNER_TEMP/loofah-ipa"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createDecipheriv, createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const asset = '.testflight-asset/.github/testflight/Loofah.ipa';
          const encrypted = readFileSync(`${asset}.enc`);
          const key = Buffer.from(process.env.IPA_KEY, 'hex');
          assert.equal(key.length, 32);
          const decipher = createDecipheriv('aes-256-gcm', key, encrypted.subarray(0, 12));
          decipher.setAuthTag(encrypted.subarray(-16));
          const ipa = Buffer.concat([decipher.update(encrypted.subarray(12, -16)), decipher.final()]);
          assert.equal(createHash('sha256').update(ipa).digest('hex'), readFileSync(`${asset}.sha256`, 'utf8').trim());
          writeFileSync(`${process.env.RUNNER_TEMP}/loofah-ipa/Loofah.ipa`, ipa, { mode: 0o600 });
          JS
      - name: Verify exported app and upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/loofah-ipa/Loofah.ipa"
          ditto -x -k "$ipa" "$RUNNER_TEMP/loofah-ipa-check"
          app="$RUNNER_TEMP/loofah-ipa-check/Payload/Loofah.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "${MAC_TAG#v}"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract DTSDKName raw -o - "$app/Info.plist")" = iphoneos27.2
          test "$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist")" = '[1]'
          test "$(plutil -extract NSSupportsLiveActivities raw -o - "$app/Info.plist")" = true
          widget="$app/PlugIns/RecordingWidget.appex/Info.plist"
          test "$(plutil -extract DTSDKName raw -o - "$widget")" = iphoneos27.2
          test "$(plutil -extract CFBundleDisplayName raw -o - "$widget")" = Loofah
          test "$(plutil -extract CFBundleIdentifier raw -o - "$widget")" = io.loofah.notes.RecordingWidget
          test "$(plutil -extract CFBundleVersion raw -o - "$widget")" = "$BUILD_NUMBER"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$widget")" = "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")"
          codesign --verify --deep --strict "$app"
          python3 scripts/verify-icloud-profile.py "$app/embedded.mobileprovision" io.loofah.notes --app "$app"
          xcrun altool --upload-app -f "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" \
            --p8-file-path "$RUNNER_TEMP/AuthKey.p8"
