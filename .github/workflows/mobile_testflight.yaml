name: mobile-testflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      APPLE_DEVELOPMENT_TEAM: L8GUHT98B4
      MOBILE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: ./.github/actions/rust_install
        with:
          platform: ios
      - run: pnpm -F @hypr/mobile typecheck
      - run: pnpm -F @hypr/mobile test
      - run: pnpm -F @hypr/mobile build
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: pnpm -F @hypr/mobile ios:init --ci
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_CONTENT" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::App Store Connect API key secrets are required"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive iPhone app and Recording widget
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project apps/mobile/src-tauri/gen/apple/mobile.xcodeproj \
            -scheme mobile_iOS \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Loofah.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic
      - name: Export signed App Store IPA
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mobile-export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_DEVELOPMENT_TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Loofah.xcarchive" \
            -exportPath "$RUNNER_TEMP/mobile-export" \
            -exportOptionsPlist "$RUNNER_TEMP/mobile-export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
      - name: Find IPA
        id: ipa
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/mobile-export"/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error::Expected one exported IPA, found ${#ipas[@]}"
            exit 1
          fi
          echo "path=${ipas[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: loofah-ios-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 7
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: >-
          xcrun altool --upload-app -f "$IPA_PATH"
          --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          --p8-file-path "$RUNNER_TEMP/AuthKey.p8"
