name: desktop-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      desktop_rust: ${{ steps.select.outputs.desktop_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: python3 .github/scripts/ci_scope.py

  frontend:
    needs: scope
    if: ${{ !startsWith(github.head_ref || '', 'blog/') && needs.scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F ui build
      - run: pnpm -F desktop typecheck
      - run: pnpm -F desktop test
      - run: pnpm -F desktop i18n:check

  rust:
    needs: scope
    if: ${{ !startsWith(github.head_ref || '', 'blog/') && needs.scope.outputs.desktop_rust == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare ChatGPT model catalog
        run: node apps/desktop/src-tauri/scripts/prepare-codex-models.mjs
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: Native notification lifetime tests
        run: swift test --package-path crates/notification-macos/swift-lib
      - run: cargo check -p desktop
      - run: cargo test -p desktop
      - run: |
          cargo test --workspace \
            --exclude desktop \
            --exclude notification-macos \
            --exclude tcc \
            --exclude notification-linux \
            --exclude aec \
            --exclude whisper \
            --exclude whisper-local \
            --exclude whisper-local-model \
            --exclude vad \
            --exclude vad-masking \
            --exclude onnx \
            --exclude bundle \
            --exclude host \
            --exclude intercept \
            --exclude frontmatter \
            --exclude audio \
            --exclude audio-device \
            --exclude transcribe-whisper-local \
            --exclude device-monitor \
            --exclude tauri-plugin-deeplink2 \
            --exclude tauri-plugin-detect \
            --exclude tauri-plugin-fs-sync \
            --exclude tauri-plugin-fs2 \
            --exclude tauri-plugin-icon \
            --exclude tauri-plugin-local-stt \
            --exclude tauri-plugin-misc \
            --exclude tauri-plugin-notification \
            --exclude tauri-plugin-notify \
            --exclude tauri-plugin-opener2 \
            --exclude tauri-plugin-permissions \
            --exclude tauri-plugin-settings \
            --exclude tauri-plugin-sidecar2 \
            --exclude tauri-plugin-store2 \
            --exclude tauri-plugin-tantivy \
            --exclude tauri-plugin-template \
            --exclude tauri-plugin-tracing \
            --exclude tauri-plugin-updater2 \
            --exclude tauri-plugin-windows
