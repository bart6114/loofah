name: Prepare CLI native libraries
description: Pin ONNX Runtime builds compatible with the supported CLI platforms.
inputs:
  target:
    description: Rust target triple.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        # ort's default Linux archives exceed our glibc floor; Intel macOS has no default archive.
        # Custom static linking: https://ort.pyke.io/setup/linking
        case "$TARGET" in
          x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu)
            bash "$GITHUB_ACTION_PATH/linux.sh" "$TARGET"
            exit 0
            ;;
          x86_64-apple-darwin)
            archive=onnxruntime-osx-x86_64-static_lib-1.28.0.zip
            checksum=88c6037c0eb9a7f0013729e0181feec4fb9ef30ca37769aa7b69d2478450c415
            ;;
          aarch64-apple-darwin) exit 0 ;;
          *) echo "Unsupported CLI target: $TARGET" >&2; exit 1 ;;
        esac
        destination="$RUNNER_TEMP/cli-onnxruntime"
        mkdir -p "$destination"
        curl --proto '=https' --tlsv1.2 --location --fail --retry 5 \
          "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.0/$archive" \
          --output "$destination/$archive"
        printf '%s  %s\n' "$checksum" "$destination/$archive" | shasum -a 256 -c -
        unzip -q "$destination/$archive" -d "$destination"
        library_dir="$destination/${archive%.zip}/lib"
        test -s "$library_dir/libonnxruntime.a"
        {
          echo "ORT_LIB_PATH=$library_dir"
          echo "LOOFAH_NATIVE_CACHE=onnxruntime-$checksum"
        } >> "$GITHUB_ENV"
