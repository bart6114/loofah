# Apple's guidance: notarize the outermost shipped container.
# Tauri already signs+notarizes+staples the .app; it also signs the DMG.
# But Tauri does NOT notarize or staple the DMG itself.
# This action closes that gap: verify the DMG is signed (sign if not),
# then notarize and staple it as the outermost distribution artifact.
#
# https://developer.apple.com/documentation/xcode/packaging-mac-software-for-distribution
# https://developer.apple.com/forums/thread/794045
# https://developer.apple.com/videos/play/wwdc2019/703/
# https://developer.apple.com/forums/thread/122045

name: "Notarize macOS DMG"
description: "Sign (if needed), notarize, and staple a macOS DMG"
inputs:
  dmg-path:
    description: "Path to the DMG file"
    required: true
  signing-identity:
    description: "Developer ID Application signing identity (used to sign the DMG if it is not already signed)"
    required: false
  api-key-path:
    description: "Path to the App Store Connect API private key"
    required: true
  api-key-id:
    description: "App Store Connect API key ID"
    required: true
  api-issuer:
    description: "App Store Connect API issuer ID"
    required: true
runs:
  using: "composite"
  steps:
    - name: Notarize DMG
      shell: bash
      env:
        DMG_PATH: ${{ inputs.dmg-path }}
        SIGNING_IDENTITY: ${{ inputs.signing-identity }}
        API_KEY_PATH: ${{ inputs.api-key-path }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        API_ISSUER: ${{ inputs.api-issuer }}
      run: |
        set -euo pipefail
        started=$SECONDS

        if [[ ! -f "$DMG_PATH" ]]; then
          echo "::error::DMG not found at $DMG_PATH"
          exit 1
        fi

        if [[ ! -f "$API_KEY_PATH" ]]; then
          echo "::error::Notarization API key not found at $API_KEY_PATH"
          exit 1
        fi

        if [[ -z "$API_KEY_ID" || -z "$API_ISSUER" ]]; then
          echo "::error::Notarization API key ID and issuer are required"
          exit 1
        fi

        hdiutil verify "$DMG_PATH"

        if ! codesign --verify --verbose=4 "$DMG_PATH"; then
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::DMG is not signed and no signing identity was provided"
            exit 1
          fi
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --verbose=4 "$DMG_PATH"
        fi

        NOTARY_RESULT="$RUNNER_TEMP/dmg-notarization-result.json"
        NOTARY_LOG="$RUNNER_TEMP/dmg-notarization-log.json"
        SUBMIT_EXIT_CODE=0
        xcrun notarytool submit "$DMG_PATH" \
          --key "$API_KEY_PATH" \
          --key-id "$API_KEY_ID" \
          --issuer "$API_ISSUER" \
          --wait \
          --output-format json \
          > "$NOTARY_RESULT" || SUBMIT_EXIT_CODE=$?

        NOTARY_STATUS="$(jq -r '.status // empty' "$NOTARY_RESULT" 2>/dev/null || true)"
        NOTARY_ID="$(jq -r '.id // empty' "$NOTARY_RESULT" 2>/dev/null || true)"
        cat "$NOTARY_RESULT"

        if [[ "$SUBMIT_EXIT_CODE" -ne 0 || "$NOTARY_STATUS" != "Accepted" ]]; then
          if [[ -n "$NOTARY_ID" ]]; then
            xcrun notarytool log "$NOTARY_ID" "$NOTARY_LOG" \
              --key "$API_KEY_PATH" \
              --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER" && cat "$NOTARY_LOG" || true
          fi
          echo "::error::DMG notarization failed with status ${NOTARY_STATUS:-unknown}"
          exit 1
        fi

        xcrun stapler staple "$DMG_PATH"
        xcrun stapler validate "$DMG_PATH"
        spctl -a -t open -vvv --context context:primary-signature "$DMG_PATH"

        mkdir -p "$RUNNER_TEMP/build-metrics"
        printf '{"stage":"dmg-notarization","seconds":%s,"exit_code":0}\n' "$((SECONDS - started))" \
          > "$RUNNER_TEMP/build-metrics/dmg-notarization.json"
