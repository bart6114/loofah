name: Prepare macOS release build
description: Select the native toolchain and describe compatible release outputs.
inputs:
  cache-namespace:
    description: Use a new namespace for a cold benchmark, then reuse it for a warm run.
    default: release-v2
  legacy-layout:
    description: Benchmark the previous separate target directories and dependency-only cache.
    default: "false"
outputs:
  shared-key:
    description: Cache family for the selected release layout.
    value: macos-${{ inputs.cache-namespace }}-${{ inputs.legacy-layout }}
  workspaces:
    description: Cargo target directories to preserve.
    value: ${{ steps.layout.outputs.workspaces }}
  cache-workspace-crates:
    description: Whether these sources support restoring native workspace outputs.
    value: ${{ steps.layout.outputs.workspace-cache }}
runs:
  using: composite
  steps:
    - id: layout
      shell: bash
      env:
        LEGACY_LAYOUT: ${{ inputs.legacy-layout }}
        NATIVE_SOURCES: ${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.swift', '**/build.rs', 'vendor/whisper-rs/**', '!.release-ci/**') }}
      run: |
        set -euo pipefail
        developer_dir=/Applications/Xcode_26.6.app/Contents/Developer
        test -d "$developer_dir"
        sudo xcode-select --switch "$developer_dir"
        native_toolchain="$(xcodebuild -version; xcrun --sdk macosx --show-sdk-version; xcrun swift --version)"
        # Swift build databases also depend on SDK/toolchain file metadata in the image.
        runner_image="${ImageOS:?Missing hosted runner image}-${ImageVersion:?Missing hosted runner image version}"
        native_key="$(printf '%s\n' "$runner_image" "$native_toolchain" "$NATIVE_SOURCES" | shasum -a 256 | awk '{print $1}')"
        {
          echo "DEVELOPER_DIR=$developer_dir"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)"
          echo "LOOFAH_NATIVE_CACHE=$native_key"
          echo "LOOFAH_BUILD_METRICS=$RUNNER_TEMP/build-metrics/native.tsv"
          if [ "$LEGACY_LAYOUT" != true ]; then
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
          fi
        } >> "$GITHUB_ENV"
        {
          echo 'workspaces<<WORKSPACES'
          echo '. -> target'
          if [ "$LEGACY_LAYOUT" = true ]; then
            echo 'apps/desktop/src-tauri -> target'
          fi
          echo WORKSPACES
        } >> "$GITHUB_OUTPUT"
        workspace_cache=false
        if [ "$LEGACY_LAYOUT" != true ] &&
          grep -Fq 'cargo:rerun-if-changed={}", destination.display()' crates/transcribe-soniqo/build.rs &&
          grep -Fq 'cargo:rerun-if-changed={}", dst.display()' apps/desktop/src-tauri/build.rs; then
          workspace_cache=true
        fi
        echo "workspace-cache=$workspace_cache" >> "$GITHUB_OUTPUT"
        mkdir -p "$RUNNER_TEMP/build-metrics"
        printf '%s\n' "$native_toolchain" > "$RUNNER_TEMP/build-metrics/toolchain.txt"
        printf '%s\n' "$runner_image" > "$RUNNER_TEMP/build-metrics/runner-image.txt"
