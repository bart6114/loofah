name: Install Rust
description: Install the workspace toolchain and configure Rust build caching.
inputs:
  platform:
    description: Optional platform whose Rust targets and system dependencies should be installed.
    required: false
    default: ""
  shared-key:
    description: Cache family shared by compatible jobs.
    default: ""
  workspaces:
    description: Cargo workspace to target directory mappings.
    default: |
      . -> target
      apps/desktop/src-tauri -> target
  cache-workspace-crates:
    description: Preserve workspace libraries and their native build outputs.
    default: "false"
runs:
  using: "composite"
  steps:
    - id: toolchain
      run: |
        echo "channel=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2)" >> $GITHUB_OUTPUT
        echo "components=$(grep 'components' rust-toolchain.toml | sed 's/.*\[//' | sed 's/\].*//' | tr -d '"' | tr -d ' ')" >> $GITHUB_OUTPUT
      shell: bash
    - id: cache-key
      run: |
        if command -v ldd &> /dev/null; then
          GLIBC_VER=$(ldd --version 2>/dev/null | head -n1 | awk '{print $NF}')
          echo "suffix=-glibc-${GLIBC_VER}" >> $GITHUB_OUTPUT
        else
          echo "suffix=" >> $GITHUB_OUTPUT
        fi
      shell: bash
    - if: inputs.platform == 'macos'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: aarch64-apple-darwin,x86_64-apple-darwin
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == 'ios'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == 'android'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == 'windows'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == 'linux'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev
      shell: bash
    - if: inputs.platform == 'linux-x86_64'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: x86_64-unknown-linux-gnu
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == 'linux-aarch64'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: aarch64-unknown-linux-gnu
        components: ${{ steps.toolchain.outputs.components }}
    - if: inputs.platform == ''
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ steps.toolchain.outputs.components }}
    # Hosted images include an unrelated stable toolchain; rust-cache hashes it too.
    - if: runner.environment == 'github-hosted'
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      run: |
        set -euo pipefail
        rustup default "$TOOLCHAIN"
        active="$(rustup show active-toolchain | awk '{print $1}')"
        while read -r toolchain _; do
          if [ "$toolchain" != "$active" ]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done < <(rustup toolchain list)
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "true"
        cache-on-failure: ${{ inputs.platform == 'windows' }}
        prefix-key: v0-rust${{ steps.cache-key.outputs.suffix }}
        shared-key: ${{ inputs.shared-key }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
        env-vars: SDKROOT DEVELOPER_DIR LOOFAH_NATIVE_CACHE
        workspaces: ${{ inputs.workspaces }}
