[package]
name = "loof-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "loof"
path = "src/main.rs"

[build-dependencies]
serde_json = { workspace = true }

[features]
dev-fixtures = ["hypr-loofah-client/dev-fixtures"]

[dependencies]
hypr-agent-access = { workspace = true }
hypr-export-core = { workspace = true }
hypr-fs-sync-core = { workspace = true }
hypr-listener2-core = { workspace = true }
hypr-loofah-client = { workspace = true, features = ["os-credentials"] }
hypr-loofah-core = { workspace = true }
hypr-loofah-local-owner = { workspace = true, features = ["core"] }
hypr-loofah-protocol = { workspace = true }
hypr-search-cache = { workspace = true }
hypr-storage = { workspace = true }
hypr-transcribe-soniqo = { workspace = true }
hypr-vault-read = { workspace = true }
hypr-vault-write = { workspace = true }

open = { workspace = true }
owhisper-interface = { workspace = true }

chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
cli-docs = { path = "../../crates/cli-docs" }
hound = { workspace = true }
insta = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client"] }
