[package]
name = "loofah-server"
version = "0.1.0"
edition = "2024"

[features]
cpu-transcription = [
  "dep:hypr-transcribe-core",
  "dep:hypr-transcribe-whisper-local",
  "dep:hypr-whisper",
  "dep:owhisper-interface",
]

[build-dependencies]
serde_json = { workspace = true }

[dependencies]
async-stream = { workspace = true }
axum = { workspace = true, features = ["json", "ws"] }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
hypr-loofah-core = { workspace = true }
hypr-loofah-protocol = { workspace = true }
hypr-search-cache = { workspace = true }
hypr-storage = { workspace = true }
hypr-transcribe-core = { workspace = true, optional = true }
hypr-transcribe-whisper-local = { workspace = true, optional = true }
hypr-vault-read = { workspace = true }
hypr-vault-write = { workspace = true }
hypr-whisper = { workspace = true, optional = true }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
owhisper-interface = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
base64 = { workspace = true }
hound = { workspace = true }
http-body-util = "0.1"
hypr-loofah-client = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "test-util"] }
tower = { workspace = true, features = ["util"] }
